name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test
        run: python -m pytest -q
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build --outdir dist
      - name: Install wheel in clean venv and smoke-test CLI
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/jevbench --help
          /tmp/wheel-venv/bin/python -c "import jevbench.adapters, jevbench.cli"
